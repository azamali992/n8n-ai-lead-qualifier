name: workflow e2e
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install -g n8n@2.35.7
      - name: Workflow JSON is up to date with build_workflow.py
        run: |
          python scripts/build_workflow.py
          git diff --exit-code workflows/
      - run: python tests/run_workflow_tests.py
